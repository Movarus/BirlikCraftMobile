name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      BIRLIK_AUTH_SECRET: ${{ secrets.BIRLIK_AUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # BirlikCraft client mod (Minecraft 26.x needs Java 25). If it fails, the APK is still
      # built without the bundled mod.
      - name: Set up JDK 25 (BirlikCraft mod)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build BirlikCraft mod
        continue-on-error: true
        run: |
          cd birlikcraft-mod
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          mkdir -p ../app_pojavlauncher/src/main/assets/birlikcraft
          cp "$(ls build/libs/birlikcraft-core-*.jar | grep -v sources | head -1)" ../app_pojavlauncher/src/main/assets/birlikcraft/birlikcraft-core.jar
          ls -l ../app_pojavlauncher/src/main/assets/birlikcraft/

      - name: Inspect Minecraft jar (pack format / GUI textures)
        continue-on-error: true
        run: |
          JAR=$(find ~/.gradle birlikcraft-mod/.gradle -name "*.jar" 2>/dev/null | grep -iE "minecraft-(client|merged|common)" | grep -v sources | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle birlikcraft-mod/.gradle -name "*.jar" 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "version.json" && echo "{}"' | head -1)
          echo "JAR=$JAR"
          find ~/.gradle birlikcraft-mod/.gradle -name "*.jar" 2>/dev/null | grep -i minecraft | head -20
          unzip -p "$JAR" version.json || true
          echo "=== GUI FILES ==="
          unzip -l "$JAR" | grep -E "assets/minecraft/textures/gui/" | awk '{print $4}' | grep -vE "/(container|advancements|hud|recipe_book|toasts)/" | head -300
          echo "=== pack.mcmeta ==="
          unzip -p "$JAR" pack.mcmeta || true

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      # - name: Get JRE17
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-new
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre17-pojav
      #
      # - name: Get JRE21
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-21
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre21-pojav
      #
      # - name: Get JRE25
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-25
      #     workflow_conclusion: completed
      #     repo: FCL-Team/Android-OpenJDK-Build
      #     branch: Build_JRE_25
      #     name: jre25-multiarch

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Build Release .apk
        # Needs the STORE_PASSWORD / KEY_PASSWORD secrets; the debug APK is built either way
        continue-on-error: true
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk

      - name: Gen md5sums
        continue-on-error: true
        run: |
          md5sum out/app-release.apk > out/app-release.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*

      - name: Upload release APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.*
