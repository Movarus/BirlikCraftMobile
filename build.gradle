import java.io.IOException
plugins{
    id 'com.android.application' version '8.7.2' apply false
    id 'com.android.library' version '8.7.2' apply false
}

String resolveGitPath() {
    def candidates = [
        "git",
        "C:\\Program Files\\Git\\cmd\\git.exe",
        "C:\\Program Files\\Git\\bin\\git.exe"
    ]
    for (String c : candidates) {
        if (c == "git" || new File(c).exists()) {
            return c
        }
    }
    return "git"
}

String getGitHash(String project) {
    try {
        def gitCmd = resolveGitPath()
        def command = Runtime.getRuntime().exec([gitCmd, "rev-list", "-1", "HEAD", project] as String[])
        def returnCode = command.waitFor()
        if (returnCode != 0) {
            return "birlikcraft-local"
        }
        return command.inputStream.text.trim()
    } catch (Exception e) {
        return "birlikcraft-local"
    }
}

Boolean gitUsed() {
    try {
        def gitCmd = resolveGitPath()
        def returnCode = Runtime.getRuntime().exec([gitCmd, "rev-parse", "--is-inside-work-tree"] as String[]).waitFor()
        return returnCode == 0
    } catch (Exception e) {
        return false
    }
}
